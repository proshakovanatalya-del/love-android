name: Build My Game APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # Явно просим установить нужные пакеты
          packages: 'platform-tools build-tools;34.0.0 platforms;android-34'

      - name: Accept licenses
        run: yes | sdkmanager --licenses || true

      - name: Setup Android NDK
        run: |
          # Устанавливаем NDK через sdkmanager, но с проверкой
          sdkmanager --install "ndk;25.2.9519653" --channel=0
          # Прописываем пути в GITHUB_ENV, чтобы они были видны следующим шагам
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$ANDROID_HOME/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: Grant execute permission to gradlew
        run: chmod +x gradlew

      - name: Build APK
        run: ./gradlew assembleEmbedNoRecordRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: my-game-apk
          path: app/build/outputs/apk/embedNoRecord/release/*.apk
